<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="vocab_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>vocab_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.speechRecognizer = {
      _recognition: null,
      _isListening: false,

      isSupported: function() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      },

      start: function(expectedWord, onResult) {
        if (this._isListening) this.stop();
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { onResult('NOT_SUPPORTED', 0); return; }

        var rec = new SpeechRecognition();
        rec.lang = 'en-US';
        rec.interimResults = false;
        rec.maxAlternatives = 3;
        this._recognition = rec;
        this._isListening = true;

        rec.onresult = function(event) {
          var best = '';
          var bestScore = 0;
          var expected = expectedWord.trim().toLowerCase();
          for (var i = 0; i < event.results[0].length; i++) {
            var transcript = event.results[0][i].transcript.trim().toLowerCase();
            var confidence = event.results[0][i].confidence || 0;
            if (transcript === expected) { best = transcript; bestScore = 1.0; break; }
            if (confidence > bestScore) { best = transcript; bestScore = confidence; }
          }
          var score = (best === expected) ? 1.0 : bestScore * 0.5;
          onResult(best, Math.round(score * 100));
        };

        rec.onerror = function(event) {
          onResult('ERROR:' + event.error, 0);
        };

        rec.onend = function() {
          window.speechRecognizer._isListening = false;
        };

        rec.start();
      },

      stop: function() {
        if (this._recognition) {
          try { this._recognition.stop(); } catch(e) {}
          this._recognition = null;
        }
        this._isListening = false;
      }
    };
  </script>
</body>
</html>
